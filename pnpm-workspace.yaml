packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - hono@4.13.23
  - vite@8.4.0

allowBuilds:
  esbuild: true
  workerd: true

overrides:
  # @neon/auth pins 1.3.2 while better-auth wants 1.3.3; two copies split @better-auth/core
  # and break the client's plugin types (emailOtp missing). Remove when @neon/auth catches up.
  '@better-fetch/fetch': 1.3.3
